// ── Engine functions ──────────────────────────────────────────────────────────
const pStat = (p, gk, s) => { const i = G_COLS[gk].indexOf(s); return i >= 0 ? p[5+i] : null; };
const unitStat = (combo, gk, s) => {
  const v = combo.map(p => pStat(p,gk,s)).filter(v => v != null);
  return v.length ? v.reduce((a,b)=>a+b)/v.length : null;
};
const axisBlend = (combo, gk, parts) => {
  let s=0,w=0;
  for (const [stat,wt] of parts) { const v=unitStat(combo,gk,stat); if(v==null) return null; s+=v*wt; w+=wt; }
  return s/w;
};
const eligiblePlayers = (ps, gk, N) => {
  if (!FILTER_ELG.has(gk)) return ps;
  const sorted = [...ps].sort((a,b)=>b[4]-a[4]);
  const topN = sorted.slice(0,N);
  if (!topN.length) return ps;
  const mu = topN.reduce((x,p)=>x+p[4],0)/topN.length;
  const cut = Math.max(mu*0.70, 80);
  const elig = ps.filter(p=>p[4]>=cut);
  return elig.length >= N ? elig : sorted.slice(0,N);
};
const combos = (arr, n) => {
  if (n<=0 || arr.length<n) return [];
  if (n===1) return arr.map(x=>[x]);
  return arr.flatMap((x,i) => combos(arr.slice(i+1),n-1).map(r=>[x,...r]));
};
const _uc = new Map();
const bestUnit = (y, t, gk) => {
  const k = `${y}|${t}|${gk}`;
  if (_uc.has(k)) return _uc.get(k);
  const ps = (DATA[y]?.[t]?.[gk]) || [];
  const N = GROUP_SIZE[gk];
  const elig = eligiblePlayers(ps, gk, N);
  const all = combos(elig, Math.min(N, elig.length));
  if (!all.length) { const r={A:50,D:50,S:50,label:"?",names:[]}; _uc.set(k,r); return r; }
  let best=null, bs=-1;
  for (const c of all) {
    const A = axisBlend(c,gk,AXES[gk].A)||50;
    const D = axisBlend(c,gk,AXES[gk].D)||50;
    let bestS=null;
    for (const [label,parts] of SPECIALS[gk]) {
      const v = axisBlend(c,gk,parts);
      if (v!=null && (!bestS||v>bestS.score)) bestS={label,score:v};
    }
    const S = bestS?.score||50;
    const sc = A+D+S;
    if (sc>bs) { bs=sc; best={A:Math.round(A),D:Math.round(D),S:Math.round(S),label:bestS?.label||"?",combo:c,names:c.map(p=>p[0]),prov:c.some(p=>p[p.length-1]===1)}; }
  }
  _uc.set(k,best); return best;
};
const axesOf = (y, t) => Object.fromEntries(GK.map(g=>[g, bestUnit(y,t,g)]));
const battle = (a, b) => {
  let aw=0,bw=0;
  for (const k of ["A","D","S"]) { if(a[k]>b[k]) aw++; else if(b[k]>a[k]) bw++; }
  return aw>bw ? 1 : bw>aw ? -1 : 0;
};
const testVs = (rax, cy, ct) => {
  let m=0,t=0,ms=0,os=0;
  const cx = axesOf(cy,ct);
  const detail = GK.map(g => {
    const a=rax[g], b=cx[g], r=battle(a,b);
    if(r>0) m++; else if(r<0) t++;
    ms+=a.A+a.D+a.S; os+=b.A+b.D+b.S;
    return {gk:g,mine:a,opp:b,won:r>0,draw:r===0};
  });
  const won = (m>t)||(m===t&&ms>=os);
  return {won, detail, score:`${m}-${t}`};
};

      border:`1px solid rgba(${won?"61,217,122":draw?"232,184,75":"230,57,70"},.15)`}}>
      <div>
        <div style={{fontSize:10,color:C.muted,fontFamily:F,letterSpacing:.4,
          textTransform:"uppercase",marginBottom:5}}>{GK_LABEL[gk]}</div>
        <div style={{display:"flex",gap:10}}>
          {[["A",mine.A,C.atk],["D",mine.D,C.def],["S",mine.S,C.gold]].map(([l,v,c])=>(
            <div key={l}>
              <div style={{fontSize:15,fontWeight:800,color:c,fontFamily:"monospace",lineHeight:1}}>{v}</div>
              <div style={{fontSize:8,color:C.dim,fontFamily:"monospace"}}>{l}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{textAlign:"center",fontSize:20}}>{won?"✅":draw?"🤝":"❌"}</div>
      <div style={{textAlign:"right"}}>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          {[["A",opp.A,C.atk],["D",opp.D,C.def],["S",opp.S,C.gold]].map(([l,v,c])=>(
            <div key={l}>
              <div style={{fontSize:15,fontWeight:800,color:c,fontFamily:"monospace",lineHeight:1}}>{v}</div>
              <div style={{fontSize:8,color:C.dim,fontFamily:"monospace"}}>{l}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Main game component ───────────────────────────────────────────────────────
function RWC70() {
  const [phase, setPhase] = useState("intro");
  const [roster, setRoster] = useState({});
  const [usedSquads, setUsedSquads] = useState([]);
  const [deal, setDeal] = useState(null);
  const [yearSkipUsed, setYearSkipUsed] = useState(false);
  const [teamSkipUsed, setTeamSkipUsed] = useState(false);
  const [reelDisplay, setReelDisplay] = useState({team:"",year:""});
  const [spinning, setSpinning] = useState(false);
  const [matchIdx, setMatchIdx] = useState(0);
  const [matchResults, setMatchResults] = useState([]);
  const [curMatch, setCurMatch] = useState(null);
  const spinRef = useRef(null);

  const openGroups = GK.filter(g => !roster[g]);
  const draftComplete = openGroups.length === 0;

  const makeDeal = useCallback((exclude=[]) => {
    const pool = ALL_SQUADS.filter(s => !exclude.some(e=>e.y===s.y&&e.t===s.t));
    if (!pool.length) return null;
    const sq = rand(pool);
    const units = Object.fromEntries(GK.map(g=>[g, {...bestUnit(sq.y,sq.t,g), team:sq.t, year:sq.y}]));
    return {y:sq.y, t:sq.t, units};
  }, []);

  const doSpin = useCallback((exclude=usedSquads) => {
    setSpinning(true);
    setPhase("spinning");
    let count=0;
    const totalTicks=20;
    const interval=setInterval(()=>{
      const s=rand(ALL_SQUADS);
      setReelDisplay({team:s.t, year:s.y});
      count++;
      if(count>=totalTicks){
        clearInterval(interval);
        const d = makeDeal(exclude);
        if(d){
          setDeal(d);
          setReelDisplay({team:d.t, year:d.y});
        }
        setSpinning(false);
        setPhase("pick");
      }
    },80);
    spinRef.current=interval;
  }, [usedSquads, makeDeal]);

  const makeDealFor = useCallback((y, t) => {
    const units = Object.fromEntries(GK.map(g=>[g, {...bestUnit(y,t,g), team:t, year:y}]));
    return {y, t, units};
  }, []);

  const spinTo = useCallback((y, t) => {
    setSpinning(true);
    setPhase("spinning");
    let count=0;
    const totalTicks=12;
    const interval=setInterval(()=>{
      const s=rand(ALL_SQUADS);
      setReelDisplay({team:s.t, year:s.y});
      count++;
      if(count>=totalTicks){
        clearInterval(interval);
        setDeal(makeDealFor(y,t));
        setReelDisplay({team:t, year:y});
        setSpinning(false);
        setPhase("pick");
      }
    },70);
    spinRef.current=interval;
  }, [makeDealFor]);

  const startGame = () => {
    setRoster({}); setUsedSquads([]); setYearSkipUsed(false); setTeamSkipUsed(false);
    setMatchIdx(0); setMatchResults([]); setCurMatch(null);
    doSpin([]);
  };

  const yearOptions = deal ? [2011,2015,2019,2023].filter(y =>
    y!==deal.y && DATA[y]?.[deal.t] && !usedSquads.some(s=>s.y===y&&s.t===deal.t)) : [];
  const canYearSkip = !yearSkipUsed && !spinning && yearOptions.length>0;
  const changeYear = () => {
    if (!canYearSkip) return;
    setYearSkipUsed(true);
    spinTo(rand(yearOptions), deal.t);
  };

  const teamOptions = deal ? Object.keys(DATA[deal.y]||{}).filter(t =>
    t!==deal.t && !usedSquads.some(s=>s.y===deal.y&&s.t===t)) : [];
  const canTeamSkip = !teamSkipUsed && !spinning && teamOptions.length>0;
  const changeTeam = () => {
    if (!canTeamSkip) return;
    setTeamSkipUsed(true);
    spinTo(deal.y, rand(teamOptions));
  };

  const pickUnit = (gk) => {
    if (roster[gk] || !deal) return;
    const unit = deal.units[gk];
    const newRoster = {...roster, [gk]: unit};
    const newUsed = [...usedSquads, {y:deal.y, t:deal.t}];
    setRoster(newRoster);
    setUsedSquads(newUsed);
    if (Object.keys(newRoster).length < 6) {
      setTimeout(() => doSpin(newUsed), 400);
    } else {
      setPhase("ready");
    }
  };

  const startGauntlet = () => {
    setMatchIdx(0); setMatchResults([]); setCurMatch(null); setPhase("gauntlet");
    runMatch(0);
  };

  const runMatch = (idx) => {
    const opp = LADDER[idx];
    const result = testVs(roster, opp.year, opp.team);
    setCurMatch({...result, opp});
    setPhase("match_result");
  };

  const nextMatch = () => {
    const newResults = [...matchResults, curMatch];
    setMatchResults(newResults);
    const next = matchIdx + 1;
    if (next >= LADDER.length) {
      setMatchResults(newResults);
      setPhase("final");
    } else {
      setMatchIdx(next);
      runMatch(next);
    }
  };

  // ── Shared styles ──────────────────────────────────────────────────────────
  const base={
    minHeight:"100vh",background:C.bg,color:C.text,fontFamily:F,
    display:"flex",flexDirection:"column",alignItems:"center",
    padding:"16px 16px 40px",
  };
  const wrap={width:"100%",maxWidth:440};
  const gStyles=`
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,800&display=swap');
    *{box-sizing:border-box;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:${C.bg};}
    ::-webkit-scrollbar-thumb{background:#1e3040;border-radius:4px;}
    button:active{transform:scale(.97);}
  `;

  const PrimaryBtn=({onClick,children,style={}})=>(
    <button onClick={onClick} style={{width:"100%",border:"none",borderRadius:12,
      padding:"16px",fontSize:18,fontWeight:800,cursor:"pointer",fontFamily:F,
      letterSpacing:.8,background:C.gold,color:"#0a0e14",transition:"all .15s",...style}}>

    </button>
  );

      {children}

  // ── INTRO ──────────────────────────────────────────────────────────────────
  if (phase==="intro") return (
    <div style={base}>
      <style>{gStyles}</style>
      <div style={{...wrap,textAlign:"center",paddingTop:32}}>
        <div style={{fontSize:96,fontWeight:800,letterSpacing:-4,color:C.gold,
          fontFamily:F,lineHeight:.9,marginBottom:10}}>7-0</div>
        <div style={{fontSize:14,fontWeight:700,color:C.muted,letterSpacing:3,
          marginBottom:4,textTransform:"uppercase"}}>Rugby World Cup XV Builder</div>
        <div style={{fontSize:11,color:C.dim,marginBottom:36,fontFamily:"monospace"}}>
          2011 · 2015 · 2019 · 2023 · all 80 nations</div>
        <div style={{background:C.card,borderRadius:16,padding:24,
          border:`1px solid ${C.border}`,marginBottom:24,textAlign:"left"}}>
          <div style={{fontSize:14,color:C.text,lineHeight:1.75,marginBottom:12}}>
            <b style={{color:C.gold}}>Spin the reel</b> to be dealt a World Cup squad.
            Pick one positional unit to add to your XV.
            Use 6 different squads, then face the{" "}
            <b style={{color:C.gold}}>7-match gauntlet</b>.
          </div>
          <div style={{fontSize:13,color:C.muted,lineHeight:1.7,marginBottom:12}}>
            Beat all 7 to join the greats.
          </div>
          <div style={{paddingTop:12,borderTop:`1px solid ${C.border}`,
            fontSize:10,color:C.dim,fontFamily:"monospace",lineHeight:1.8}}>
            one ⟳ YEAR skip · one ⟳ TEAM skip per game
          </div>
        </div>
        <PrimaryBtn onClick={startGame}>KICK OFF ›</PrimaryBtn>
      </div>
    </div>
  );

  // ── SPINNING ───────────────────────────────────────────────────────────────
  if (phase==="spinning") return (
    <div style={base}>
      <style>{gStyles}</style>
      <div style={wrap}>
        <div style={{textAlign:"center",padding:"8px 0 24px",fontSize:11,
          color:C.dim,fontWeight:700,letterSpacing:2,textTransform:"uppercase"}}>
          Round {Object.keys(roster).length+1} of 6
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:28}}>
          {[["TEAM",reelDisplay.team,TEAM_COL[reelDisplay.team]||C.gold],
            ["YEAR",String(reelDisplay.year),C.atk]].map(([l,v,c])=>(
            <div key={l} style={{background:C.card,borderRadius:14,padding:"24px 16px",
              border:`3px solid ${c}`,textAlign:"center",minHeight:120,
              display:"flex",flexDirection:"column",justifyContent:"center",
              boxShadow:`0 0 20px rgba(0,0,0,.4)`}}>
              <div style={{fontSize:10,fontWeight:700,color:c,letterSpacing:2,
                textTransform:"uppercase",marginBottom:10}}>{l}</div>
              <div style={{fontSize:l==="TEAM"&&v.length>8?18:24,fontWeight:800,
                color:C.text,fontFamily:F,lineHeight:1.1,opacity:.65}}>{v||"·"}</div>
            </div>
          ))}
        </div>
        <div style={{textAlign:"center",color:C.dim,fontSize:12,
          fontFamily:"monospace",letterSpacing:2}}>spinning…</div>
      </div>
    </div>
  );

  // ── PICK ───────────────────────────────────────────────────────────────────
  if (phase==="pick" && deal) {
    const tc = TEAM_COL[deal.t]||TEAM_COL.default;
    const rnd = Object.keys(roster).length+1;
    return (
      <div style={base}>
        <style>{gStyles}</style>
        <div style={wrap}>

          {/* Round header + skip buttons */}
          <div style={{display:"flex",justifyContent:"space-between",
            alignItems:"center",marginBottom:18,padding:"2px 0"}}>
            <div style={{fontSize:11,fontWeight:700,color:C.dim,
              letterSpacing:2,textTransform:"uppercase"}}>Round {rnd} of 6</div>
            <div style={{display:"flex",gap:6}}>
              {[[changeYear,canYearSkip,yearSkipUsed,"⟳ YEAR",C.win],

                  {label}{used?" ✗":""}

            </div>
          </div>

          {/* Deal cards */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:22}}>
            <div style={{background:C.card,borderRadius:14,padding:"22px 18px",
              border:`3px solid ${tc}`,textAlign:"center",
              boxShadow:`0 4px 24px rgba(0,0,0,.4), 0 0 0 1px rgba(0,0,0,.2)`,

              <div style={{fontSize:10,fontWeight:700,color:tc,letterSpacing:2,
                textTransform:"uppercase",marginBottom:10}}>TEAM</div>
              <div style={{fontSize:deal.t.length>9?17:deal.t.length>7?20:24,
                fontWeight:800,color:C.text,fontFamily:F,lineHeight:1.15}}>{deal.t}</div>
            </div>
            <div style={{background:C.card,borderRadius:14,padding:"22px 18px",
              border:`3px solid ${C.gold}`,textAlign:"center",
              boxShadow:`0 4px 24px rgba(0,0,0,.4), 0 0 0 1px rgba(0,0,0,.2)`,
              display:"flex",flexDirection:"column",justifyContent:"center",minHeight:110}}>
              <div style={{fontSize:10,fontWeight:700,color:C.gold,letterSpacing:2,
                textTransform:"uppercase",marginBottom:10}}>YEAR</div>
              <div style={{fontSize:30,fontWeight:800,color:C.text,
                fontFamily:F,lineHeight:1.1}}>{deal.y}</div>
            </div>
          </div>

          {/* Pick label */}
          <div style={{fontSize:10,fontWeight:700,color:C.dim,letterSpacing:2,
            textTransform:"uppercase",marginBottom:12}}>Pick one unit</div>

          {/* Unit cards */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:22}}>
            {GK.map(g=>(
              <UnitCard key={g} gk={g} unit={deal.units[g]}
                onClick={()=>pickUnit(g)} disabled={!!roster[g]}
                teamColor={tc} dimmed={!!roster[g]}/>
            ))}
          </div>

          {/* Roster footer */}
          <div style={{borderTop:`1px solid ${C.border}`,paddingTop:16}}>
            <div style={{fontSize:10,color:C.dim,fontWeight:700,
              letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>Your XV</div>
            <div style={{display:"flex",flexDirection:"column",gap:7}}>
              {GK.map(g=><RosterSlot key={g} gk={g} unit={roster[g]}/>)}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ── READY ──────────────────────────────────────────────────────────────────
  if (phase==="ready") return (
    <div style={base}>
      <style>{gStyles}</style>
      <div style={wrap}>
        <div style={{textAlign:"center",paddingTop:8,marginBottom:24}}>
          <div style={{fontSize:11,color:C.muted,fontWeight:700,
            letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Squad Complete</div>
          <div style={{fontSize:30,fontWeight:800,color:C.gold,fontFamily:F,
            letterSpacing:.5}}>YOUR WORLD CUP XV</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:22}}>
          {GK.map(g=><RosterSlot key={g} gk={g} unit={roster[g]}/>)}

          border:`1px solid ${C.border}`,marginBottom:22}}>
          <div style={{fontSize:10,color:C.dim,fontWeight:700,letterSpacing:2,
            textTransform:"uppercase",marginBottom:12}}>The Gauntlet</div>
          {LADDER.map((l,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",
              alignItems:"center",padding:"9px 0",
              borderBottom:i<LADDER.length-1?`1px solid ${C.border}`:"none"}}>

    const curIdx = matchIdx;
    const curWins = matchResults.filter(r=>r.won).length+(curMatch.won?1:0);

      <div style={base}>
        <style>{gStyles}</style>

        </div>
      </div>
    );
