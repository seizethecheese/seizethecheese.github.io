// ── Engine functions ──────────────────────────────────────────────────────────
const pStat = (p, gk, s) => { const i = G_COLS[gk].indexOf(s); return i >= 0 ? p[5+i] : null; };
const unitStat = (combo, gk, s) => {
  const v = combo.map(p => pStat(p,gk,s)).filter(v => v != null);
  return v.length ? v.reduce((a,b)=>a+b)/v.length : null;
};
const axisBlend = (combo, gk, parts) => {
  let s=0,w=0;
  for (const [stat,wt] of parts) { const v=unitStat(combo,gk,stat); if(v==null) return null; s+=v*wt; w+=wt; }
  return s/w;
};
const eligiblePlayers = (ps, gk, N) => {
  if (!FILTER_ELG.has(gk)) return ps;
  const sorted = [...ps].sort((a,b)=>b[4]-a[4]);
  const topN = sorted.slice(0,N);
  if (!topN.length) return ps;
  const mu = topN.reduce((x,p)=>x+p[4],0)/topN.length;
  const cut = Math.max(mu*0.70, 80);
  const elig = ps.filter(p=>p[4]>=cut);
  return elig.length >= N ? elig : sorted.slice(0,N);
};
const combos = (arr, n) => {
  if (n<=0 || arr.length<n) return [];
  if (n===1) return arr.map(x=>[x]);
  return arr.flatMap((x,i) => combos(arr.slice(i+1),n-1).map(r=>[x,...r]));
};
const _uc = new Map();
const bestUnit = (y, t, gk) => {
  const k = `${y}|${t}|${gk}`;
  if (_uc.has(k)) return _uc.get(k);
  const ps = (DATA[y]?.[t]?.[gk]) || [];
  const N = GROUP_SIZE[gk];
  const elig = eligiblePlayers(ps, gk, N);
  const all = combos(elig, Math.min(N, elig.length));
  if (!all.length) { const r={A:50,D:50,S:50,label:"?",names:[]}; _uc.set(k,r); return r; }
  let best=null, bs=-1;
  for (const c of all) {
    const A = axisBlend(c,gk,AXES[gk].A)||50;
    const D = axisBlend(c,gk,AXES[gk].D)||50;
    let bestS=null;
    for (const [label,parts] of SPECIALS[gk]) {
      const v = axisBlend(c,gk,parts);
      if (v!=null && (!bestS||v>bestS.score)) bestS={label,score:v};
    }
    const S = bestS?.score||50;
    const sc = A+D+S;
    // Use SQUAD_SPECIALS override for label only — S value stays computed
    if (sc>bs) {
      bs=sc;
      const overrideLabel = SQUAD_SPECIALS[k] || bestS?.label || "?";
      best={A:Math.round(A),D:Math.round(D),S:Math.round(S),label:overrideLabel,names:c.map(p=>p[0])};
    }
  }
  _uc.set(k,best); return best;
};
const axesOf = (y, t) => Object.fromEntries(GK.map(g=>[g, bestUnit(y,t,g)]));
const battle = (a, b) => {
  let aw=0,bw=0;
  for (const k of ["A","D","S"]) { if(a[k]>b[k]) aw++; else if(b[k]>a[k]) bw++; }
  return aw>bw ? 1 : bw>aw ? -1 : 0;
};
const testVs = (rax, cy, ct) => {
  // Collect active modifiers from the player's drafted units
  const activeMods = [];
  for (const gk of GK) {
    if (!rax[gk]) continue;
    const modKey = `${rax[gk].year}|${rax[gk].team}`;
    const mod = MODIFIERS[modKey];
    if (mod && mod.gk === gk) activeMods.push(mod);
  }
  const cx = axesOf(cy, ct);
  let m=0, t=0, ms=0, os=0;
  const detail = GK.map(g => {
    let myA=rax[g].A, myD=rax[g].D, myS=rax[g].S;
    let oppA=cx[g].A, oppD=cx[g].D, oppS=cx[g].S;
    const fired = [];
    for (const mod of activeMods) {
      const tgts = Array.isArray(mod.tgt) ? mod.tgt : [mod.tgt];
      if (!tgts.includes(g)) continue;
      const tgtUnit = mod.own ? rax[g] : cx[g];
      if (mod.cond && tgtUnit.label !== mod.cond) continue;
      const f = 1 + mod.pct/100;
      if (mod.own) {
        if (mod.stat==="A") myA=Math.round(myA*f);
        else if (mod.stat==="D") myD=Math.round(myD*f);
        else if (mod.stat==="S") myS=Math.round(myS*f);
      } else {
        if (mod.stat==="A") oppA=Math.round(oppA*f);
        else if (mod.stat==="D") oppD=Math.round(oppD*f);
        else if (mod.stat==="S") oppS=Math.round(oppS*f);
      }
      fired.push(mod);
    }
    const mine = {...rax[g], A:myA, D:myD, S:myS};
    const opp  = {...cx[g],  A:oppA, D:oppD, S:oppS};
    const r = battle(mine, opp);
    if(r>0) m++; else if(r<0) t++;
    ms+=myA+myD+myS; os+=oppA+oppD+oppS;
    return {gk:g, mine, opp, won:r>0, draw:r===0, fired};
  });
  const won = (m>t)||(m===t&&ms>=os);
  return {won, detail, score:`${m}-${t}`};
};

  const [spinning, setSpinning] = useState(false);
  const [matchIdx, setMatchIdx] = useState(0);
  const [matchResults, setMatchResults] = useState([]);
  const [curMatch, setCurMatch] = useState(null);
  const [ladder, setLadder] = useState([]);
  const [spinLock, setSpinLock] = useState(null); // "team" | "year" | null
  const spinRef = useRef(null);

  const makeDeal = useCallback((exclude=[]) => {
    const pool = ALL_SQUADS.filter(s => !exclude.some(e=>e.y===s.y&&e.t===s.t));
    if (!pool.length) return null;
    const sq = rand(pool);
    const units = Object.fromEntries(GK.map(g=>[g, {...bestUnit(sq.y,sq.t,g), team:sq.t, year:sq.y}]));
    return {y:sq.y, t:sq.t, units};
  }, []);

  const doSpin = useCallback((exclude=usedSquads) => {
    setSpinLock(null);
    setSpinning(true); setPhase("spinning");
    let count=0;
    const interval=setInterval(()=>{
      const s=rand(ALL_SQUADS); setReelDisplay({team:s.t, year:s.y}); count++;
      if(count>=20){
        clearInterval(interval);
        const d=makeDeal(exclude);
        if(d){setDeal(d);setReelDisplay({team:d.t,year:d.y});}
        setSpinning(false); setPhase("pick");
      }
    },80);
    spinRef.current=interval;
  }, [usedSquads, makeDeal]);

  const makeDealFor = useCallback((y, t) => {
    const units = Object.fromEntries(GK.map(g=>[g, {...bestUnit(y,t,g), team:t, year:y}]));
    return {y, t, units};
  }, []);

  // lock="team" → team card stays fixed, year animates
  // lock="year" → year card stays fixed, team animates
  const spinTo = useCallback((y, t, lock=null) => {
    setSpinLock(lock);
    setSpinning(true); setPhase("spinning");
    let count=0;
    const interval=setInterval(()=>{
      const s=rand(ALL_SQUADS);
      setReelDisplay({
        team: lock==="team" ? t : s.t,
        year: lock==="year" ? y : s.y,
      });
      count++;
      if(count>=12){
        clearInterval(interval);
        setDeal(makeDealFor(y,t)); setReelDisplay({team:t,year:y});
        setSpinLock(null);
        setSpinning(false); setPhase("pick");
      }
    },70);
    spinRef.current=interval;
  }, [makeDealFor]);

  const startGame = () => {
    setRoster({}); setUsedSquads([]); setYearSkipUsed(false); setTeamSkipUsed(false);
    setMatchIdx(0); setMatchResults([]); setCurMatch(null); setLadder([]); setSpinLock(null);
    doSpin([]);
  };
  const goHome = () => setPhase("intro");

  const yearOptions = deal ? [2011,2015,2019,2023].filter(y =>
    y!==deal.y && DATA[y]?.[deal.t] && !usedSquads.some(s=>s.y===y&&s.t===deal.t)) : [];
  const canYearSkip = !yearSkipUsed && !spinning && yearOptions.length>0;
  const changeYear = () => { if(!canYearSkip)return; setYearSkipUsed(true); spinTo(rand(yearOptions),deal.t,"team"); };

  const teamOptions = deal ? Object.keys(DATA[deal.y]||{}).filter(t =>
    t!==deal.t && !usedSquads.some(s=>s.y===deal.y&&s.t===t)) : [];
  const canTeamSkip = !teamSkipUsed && !spinning && teamOptions.length>0;
  const changeTeam = () => { if(!canTeamSkip)return; setTeamSkipUsed(true); spinTo(deal.y,rand(teamOptions),"year"); };

  const pickUnit = (gk) => {
    if (roster[gk]||!deal) return;
    const unit = deal.units[gk];

    const newUsed = [...usedSquads,{y:deal.y,t:deal.t}];

    if(Object.keys(newRoster).length<6) setTimeout(()=>doSpin(newUsed),400);
    else { setLadder(buildLadder()); setPhase("ready"); }

    const opp=ladder[idx];
    setCurMatch({...testVs(roster,opp.year,opp.team),opp});
    setPhase("match_result");

  const startGauntlet = () => { setMatchIdx(0);setMatchResults([]);setCurMatch(null);runMatch(0); };

          <b style={{color:C.gold}}>Spin the reel</b> to be dealt a World Cup squad.
          Pick one positional unit to add to your XV.
          Use 6 different squads, then face the{" "}

        <div style={{fontSize:13,color:C.muted,lineHeight:1.7,marginBottom:16}}>
          Beat all 7 to join the greats.

        <div style={{paddingTop:12,borderTop:`1px solid ${C.border}`}}>

            [C.def,"D — Defence","Tackles, tackle success rate"],
            [C.gold,"S — Special","Position-specific skill (e.g. Scrum, Finishing, Breakdown)"],
          ].map(([c,label,desc])=>(
            <div key={label} style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:5}}>
              <span style={{fontSize:12,fontWeight:800,color:c,fontFamily:"monospace",
                width:14,flexShrink:0,paddingTop:1}}>{label[0]}</span>
              <div>
                <span style={{fontSize:12,color:c,fontWeight:700,fontFamily:F}}>{label.slice(4)}</span>
                <span style={{fontSize:11,color:C.dim,fontFamily:F}}> — {desc}</span>
              </div>
            </div>
          ))}
        </div>
        <div style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${C.border}`,
          fontSize:10,color:C.dim,fontFamily:"monospace",lineHeight:1.8}}>
          Each squad carries a unique modifier (→ 10% or ⚡ 25%) that fires during the gauntlet.<br/>
          one ⟳ YEAR skip · one ⟳ TEAM skip per game
        </div>
      </div>
      <PrimaryBtn onClick={startGame}>KICK OFF ›</PrimaryBtn>
    </div></div>
  );

  // ── SPINNING ──────────────────────────────────────────────────────────────
  if (phase==="spinning") return (
    <div style={base}><style>{gStyles}</style>
    <div style={wrap}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
        <div style={{fontSize:11,color:C.dim,fontWeight:700,letterSpacing:2,textTransform:"uppercase"}}>
          Round {Object.keys(roster).length+1} of 6</div>
        <HomeBtn/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:28}}>
        {[
          ["TEAM", spinLock==="team" ? (deal?.t||reelDisplay.team) : reelDisplay.team,
           spinLock==="team" ? (TEAM_COL[deal?.t]||C.gold) : (TEAM_COL[reelDisplay.team]||C.gold),
           spinLock==="team"],
          ["YEAR", spinLock==="year" ? String(deal?.y||reelDisplay.year) : String(reelDisplay.year),
           C.atk, spinLock==="year"],
        ].map(([l,v,c,fixed])=>(
          <div key={l} style={{background:C.card,borderRadius:14,padding:"24px 16px",
            border:`3px solid ${c}`,textAlign:"center",minHeight:120,
            display:"flex",flexDirection:"column",justifyContent:"center",
            boxShadow: fixed?`0 0 0 2px ${c}33,0 4px 24px rgba(0,0,0,.4)`:`0 0 20px rgba(0,0,0,.4)`}}>
            <div style={{fontSize:10,fontWeight:700,color:c,letterSpacing:2,
              textTransform:"uppercase",marginBottom:10}}>
              {l}{fixed&&<span style={{marginLeft:5,fontSize:8,opacity:.7}}>✓</span>}
            </div>
            <div style={{fontSize:l==="TEAM"&&v.length>8?18:24,fontWeight:800,
              color:C.text,fontFamily:F,lineHeight:1.1,
              opacity: fixed ? 1 : 0.65}}>
              {v||"·"}
            </div>
          </div>
        ))}
      </div>
      <div style={{textAlign:"center",color:C.dim,fontSize:12,fontFamily:"monospace",letterSpacing:2}}>
        spinning…</div>
    </div></div>
  );

  // ── PICK ──────────────────────────────────────────────────────────────────
  if (phase==="pick" && deal) {
    const tc=TEAM_COL[deal.t]||TEAM_COL.default;
    const rnd=Object.keys(roster).length+1;
    return (
      <div style={base}><style>{gStyles}</style>
      <div style={wrap}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,gap:8}}>
          <div style={{fontSize:11,fontWeight:700,color:C.dim,letterSpacing:2,
            textTransform:"uppercase",flexShrink:0}}>Round {rnd} of 6</div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {[[changeYear,canYearSkip,yearSkipUsed,"⟳ YEAR",C.win],
              [changeTeam,canTeamSkip,teamSkipUsed,"⟳ TEAM",C.atk]
            ].map(([fn,can,used,label,col],i)=>(
              <button key={i} onClick={fn} disabled={!can}
                style={{background:can?"rgba(255,255,255,.05)":"transparent",
                  color:can?col:C.dim,border:`1px solid ${can?col:C.border}`,
                  borderRadius:8,padding:"7px 10px",fontSize:11,
                  cursor:can?"pointer":"not-allowed",fontFamily:F,fontWeight:700,
                  letterSpacing:.3,opacity:used?.45:1,whiteSpace:"nowrap"}}>
                {label}{used?" ✗":""}
              </button>
            ))}
            <HomeBtn/>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:22}}>
          {[[tc,"TEAM",deal.t.length>9?17:deal.t.length>7?20:24,deal.t],
            [C.gold,"YEAR",30,deal.y]].map(([c,l,fs,v])=>(
            <div key={l} style={{background:C.card,borderRadius:14,padding:"22px 18px",
              border:`3px solid ${c}`,textAlign:"center",
              display:"flex",flexDirection:"column",justifyContent:"center",minHeight:110}}>
              <div style={{fontSize:10,fontWeight:700,color:c,letterSpacing:2,
                textTransform:"uppercase",marginBottom:10}}>{l}</div>
              <div style={{fontSize:fs,fontWeight:800,color:C.text,fontFamily:F,lineHeight:1.15}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{fontSize:10,fontWeight:700,color:C.dim,letterSpacing:2,
          textTransform:"uppercase",marginBottom:12}}>Pick one unit</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:22}}>
          {GK.map(g=>(
            <UnitCard key={g} gk={g} unit={deal.units[g]}
              onClick={()=>pickUnit(g)} disabled={!!roster[g]}
              teamColor={tc} dimmed={!!roster[g]}/>
          ))}
        </div>
        <div style={{borderTop:`1px solid ${C.border}`,paddingTop:16}}>
          <div style={{fontSize:10,color:C.dim,fontWeight:700,
            letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>Your XV</div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {GK.map(g=><RosterSlot key={g} gk={g} unit={roster[g]}/>)}
          </div>
        </div>
      </div></div>
    );
  }

  // ── READY ─────────────────────────────────────────────────────────────────
  if (phase==="ready") return (
    <div style={base}><style>{gStyles}</style>
    <div style={wrap}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div>
          <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:2,
            textTransform:"uppercase",marginBottom:4}}>Squad Complete</div>
          <div style={{fontSize:28,fontWeight:800,color:C.gold,fontFamily:F,letterSpacing:.5}}>
            YOUR WORLD CUP XV</div>
        </div>
        <HomeBtn/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:22}}>
        {GK.map(g=><RosterSlot key={g} gk={g} unit={roster[g]}/>)}
      </div>
      <div style={{background:C.card,borderRadius:14,padding:18,
        border:`1px solid ${C.border}`,marginBottom:22}}>
        <div style={{fontSize:10,color:C.dim,fontWeight:700,letterSpacing:2,
          textTransform:"uppercase",marginBottom:4}}>Your Gauntlet</div>
        <div style={{fontSize:10,color:C.dim,fontFamily:F,marginBottom:12,lineHeight:1.5}}>
          Drawn this run — alternates shown dimmed</div>
        {LADDER_POOL.map((slot,i)=>{
          const drawn=ladder[i];
          return(
            <div key={i} style={{padding:"10px 0",
              borderBottom:i<LADDER_POOL.length-1?`1px solid ${C.border}`:"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
                <span style={{fontSize:12,color:C.dim,fontFamily:"monospace",
                  width:16,textAlign:"right",flexShrink:0}}>{i+1}.</span>
                <div style={{display:"flex",alignItems:"center",gap:5,flex:1,flexWrap:"wrap"}}>
                  {/* drawn opponent — highlighted */}
                  <span style={{fontSize:13,color:TEAM_COL[drawn.team]||C.muted,
                    fontFamily:F,fontWeight:700}}>
                    {drawn.team} {drawn.year}
                  </span>
                  {drawn.star&&<span style={{fontSize:11,color:C.gold}}>★</span>}
                  <span style={{fontSize:10,color:C.dim,fontFamily:F}}>{drawn.nick}</span>
                </div>
              </div>
              {/* alternates dimmed */}
              <div style={{paddingLeft:22,display:"flex",gap:8,flexWrap:"wrap"}}>
                {slot.filter(s=>!(s.team===drawn.team&&s.year===drawn.year)).map((alt,j)=>(
                  <span key={j} style={{fontSize:10,color:C.dim,fontFamily:F,opacity:.45}}>
                    {alt.team} {alt.year}
                  </span>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      <PrimaryBtn onClick={startGauntlet}>FACE THE GAUNTLET ›</PrimaryBtn>
    </div></div>
  );

  // ── MATCH RESULT ──────────────────────────────────────────────────────────
  if (phase==="match_result" && curMatch) {
    const opp=curMatch.opp;
    const oc=TEAM_COL[opp.team]||TEAM_COL.default;
    const curIdx=matchIdx;
    const curWins=matchResults.filter(r=>r.won).length+(curMatch.won?1:0);
    const curLoss=matchResults.filter(r=>!r.won).length+(curMatch.won?0:1);
    const hasNext=curIdx<LADDER_POOL.length-1;
    return (
      <div style={base}><style>{gStyles}</style>
      <div style={wrap}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontSize:11,color:C.dim,fontWeight:700,letterSpacing:2,textTransform:"uppercase"}}>
            Match {curIdx+1} of 7</div>
          <HomeBtn/>
        </div>
        <div style={{background:C.card,borderRadius:16,padding:"20px",
          border:`1px solid rgba(${curMatch.won?"61,217,122":"230,57,70"},.2)`,
          marginBottom:16,boxShadow:"0 4px 24px rgba(0,0,0,.3)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
            <div>
              <div style={{fontSize:10,color:C.dim,fontFamily:F,marginBottom:4,letterSpacing:.5}}>vs.</div>
              <div style={{fontSize:22,fontWeight:800,color:oc,fontFamily:F,lineHeight:1,marginBottom:2}}>
                {opp.team}</div>
              <div style={{fontSize:12,color:C.muted,fontFamily:F}}>{opp.year} · {opp.nick}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:44,fontWeight:800,lineHeight:.9,fontFamily:F,
                color:curMatch.won?C.win:C.lose,
                textShadow:`0 0 20px rgba(${curMatch.won?"61,217,122":"230,57,70"},.3)`}}>
                {curMatch.won?"WIN":"LOSS"}</div>
              <div style={{fontSize:12,color:C.dim,fontFamily:"monospace",marginTop:4}}>
                {curMatch.score} units</div>
            </div>
          </div>
          <div style={{paddingTop:14,borderTop:`1px solid ${C.border}`,
            display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:14,color:C.muted,fontFamily:F}}>
              Record: <b style={{color:C.text,fontSize:16}}>{curWins}–{curLoss}</b></span>
            <span style={{fontSize:12,color:C.dim,fontFamily:F}}>{LADDER_POOL.length-(curIdx+1)} left</span>
          </div>
        </div>
        <div style={{marginBottom:18}}>
          {curMatch.detail.map((b,i)=><BattleRow key={i} {...b}/>)}
        </div>
        {hasNext
          ?<GhostBtn onClick={nextMatch}>
              Next: {ladder[curIdx+1].team} {ladder[curIdx+1].year} ›
            </GhostBtn>
          :<PrimaryBtn onClick={nextMatch}>See Final Result ›</PrimaryBtn>}
      </div></div>
    );
  }

  // ── FINAL ─────────────────────────────────────────────────────────────────
  if (phase==="final") {
    const totalWins=matchResults.filter(r=>r.won).length;
    const is70=totalWins===7;
    return (
      <div style={base}><style>{gStyles}</style>
      <div style={{...wrap,textAlign:"center"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div style={{fontSize:11,color:C.dim,fontWeight:700,letterSpacing:3,textTransform:"uppercase"}}>
            Final Result</div>
          <HomeBtn/>
        </div>
        <div style={{fontSize:96,fontWeight:800,lineHeight:.85,letterSpacing:-5,
          fontFamily:F,color:is70?C.gold:totalWins>=5?C.win:C.text,
          textShadow:is70?"0 0 60px rgba(232,184,75,.45)":"none",marginBottom:16}}>
          {totalWins}<span style={{color:C.dim,fontSize:72,margin:"0 6px",fontStyle:"italic"}}>—</span>
          {7-totalWins}
        </div>
        {is70&&<div style={{fontSize:18,color:C.gold,fontWeight:800,
          letterSpacing:1,marginBottom:8}}>🏆 UNBEATEN. YOU WENT 7-0!</div>}
        <div style={{fontSize:14,color:C.muted,marginBottom:28,lineHeight:1.65}}>
          {is70?"The rarest of feats — a perfect World Cup XV gauntlet.":
           totalWins>=5?"Strong effort. Fell just short of an unbeaten run.":
           totalWins>=3?"A decent XV — but the greats got you.":"Back to the drawing board."}
        </div>
        <div style={{marginBottom:18,textAlign:"left",background:C.card,
          borderRadius:14,padding:18,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:10,color:C.dim,fontWeight:700,letterSpacing:2,
            textTransform:"uppercase",marginBottom:12}}>Gauntlet Results</div>
          {ladder.map((l,i)=>{
            const r=matchResults[i];
            return r?(
              <div key={i} style={{display:"flex",justifyContent:"space-between",
                alignItems:"center",padding:"10px 0",
                borderBottom:i<LADDER_POOL.length-1?`1px solid ${C.border}`:"none"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:18,lineHeight:1,flexShrink:0}}>{r.won?"✅":"❌"}</span>
                  <div>
                    <div style={{fontSize:13,color:r.won?C.win:C.lose,fontFamily:F,fontWeight:700}}>
                      {l.team} {l.year} {l.star?"★":""}</div>
                    <div style={{fontSize:10,color:C.dim,fontFamily:F}}>{l.nick}</div>
                  </div>
                </div>
                <span style={{fontSize:11,color:C.dim,fontFamily:"monospace",flexShrink:0}}>
                  {r.score}</span>
              </div>
            ):null;
          })}
        </div>
        <div style={{marginBottom:24,textAlign:"left",background:C.card,
          borderRadius:14,padding:18,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:10,color:C.dim,fontWeight:700,letterSpacing:2,
            textTransform:"uppercase",marginBottom:12}}>Your XV</div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {GK.map(g=>roster[g]?<RosterSlot key={g} gk={g} unit={roster[g]}/>:null)}
          </div>
        </div>
        <PrimaryBtn onClick={startGame} style={{marginBottom:12}}>Play Again ›</PrimaryBtn>
        <button onClick={goHome} style={{width:"100%",borderRadius:12,padding:"13px",
          fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:F,letterSpacing:.5,
          background:"transparent",color:C.dim,border:`1px solid ${C.border}`}}>← Home</button>
        <div style={{marginTop:16,fontSize:9,color:C.dim,fontFamily:"monospace"}}>
          RWC Challenge · rugby world cup xv builder</div>
      </div></div>
    );
  }

  return (<div style={base}><div style={{color:C.muted,padding:32,fontFamily:F}}>Loading…</div></div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(RWC70));
  </script>
</body>
</html>
